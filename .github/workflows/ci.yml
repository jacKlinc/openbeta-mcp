name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly at 02:00 PST (UTC-8) to catch upstream schema drift. See the live
    # job. GitHub cron is always UTC and does not observe DST, so this lands at
    # 03:00 local during PDT.
    - cron: "0 10 * * *"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # The benchmark harness is behind //go:build bench, so nothing else in CI
      # compiles it and it would rot unnoticed. vet type-checks without running,
      # so the live API is untouched.
      - name: go vet (bench harness)
        run: go vet -tags bench ./internal/mcpserver

      - name: build
        run: go build ./...

      # Generated code is committed, and generation is not part of the build, so
      # nothing else would notice a query edited without a regenerate.
      - name: generated code is up to date
        run: |
          go generate ./...
          if ! git diff --exit-code; then
            echo "Generated code is stale. Run: go generate ./..."
            exit 1
          fi

      # Live tests are skipped unless OPENBETA_LIVE is set, so this run stays
      # offline and deterministic. See the live job below.
      - name: test
        run: go test -race ./...

  # The live API is a free public service run by volunteers. Hitting it on every
  # push would be rude and would make CI fail for reasons unrelated to the code,
  # so these run on pull requests, nightly and on demand — never on plain pushes.
  # They exist to catch upstream schema drift, and continue-on-error keeps an
  # upstream outage from blocking a merge.
  live:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    continue-on-error: true
    # A PR gets a run per push to its branch; this stops several from piling onto
    # the upstream API at once.
    concurrency:
      group: live-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: test against live API
        env:
          OPENBETA_LIVE: "1"
        run: go test -v -run Live ./internal/openbeta

  # The vendored schema is a snapshot; upstream moves without telling us. Rather
  # than fetch at build time, re-download nightly and report the diff. A red run
  # here means the schema changed — read the diff, commit it, regenerate.
  schema-drift:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: download upstream schema
        run: npx --yes get-graphql-schema https://api.openbeta.io > schema/openbeta.graphql

      - name: report schema drift
        run: |
          if ! git diff --exit-code -- schema/openbeta.graphql; then
            echo "Upstream schema has changed. Commit the diff above and run: go generate ./..."
            exit 1
          fi

      # A schema change that alters the shape of our queries shows up here as a
      # diff in generated code, which is the part that actually breaks callers.
      - name: regenerate against upstream schema
        run: |
          go generate ./...
          git diff --exit-code -- internal/openbeta/generated/
