[project]
name = "evals"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.2.0",
    "matplotlib>=3.9",
    "mcp[cli]>=2.0.0",
    "mlflow[genai]==3.5.0",
    "pandas>=2.3.3",
    "protobuf<5",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "tiktoken>=0.13.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.30",
    "jupyterlab>=4.4",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.14",
]

[tool.ruff]
line-length = 120
# Ruff lints notebooks by default. Exploration is not held to the modules'
# standard: a path-setting first cell puts imports after statements, and a
# scratch cell imports more than it ends up using.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "F",   # pyflakes
    "E",   # pycodestyle
    "W",
    "I",   # import order
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF",
]

[tool.pytest.ini_options]
# The runner tests drive an async loop against the real MCP server; without this
# every async test is silently skipped rather than failed, which is worse.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# The packages are run as `python -m common.…` from evals/, so evals/ is normally
# the working directory and already importable. pytest collects from tests/, so
# it needs saying explicitly.
pythonpath = ["."]
