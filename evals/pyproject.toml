[project]
name = "evals"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.9",
    "mcp[cli]>=2.0.0",
    "mlflow[genai]==3.5.0",
    "pandas>=2.3.3",
    "protobuf<5",
    "tiktoken>=0.13.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.30",
    "jupyterlab>=4.4",
    "ruff>=0.14",
]

[tool.ruff]
line-length = 120
# Ruff lints notebooks by default. Exploration is not held to the modules'
# standard: a path-setting first cell puts imports after statements, and a
# scratch cell imports more than it ends up using.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "F",   # pyflakes
    "E",   # pycodestyle
    "W",
    "I",   # import order
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF",
]
